[package]
name = "vela"
version = "0.2.1"
description = "Vela 轻帆 — 现代、美观、快速的跨平台邮件客户端"
authors = ["Vela"]
edition = "2021"

[lib]
name = "vela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘 + 关窗最小化到托盘（新邮件实时监控常驻后台）
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ── 邮件协议层：IMAP 收信 + SMTP 发信 + MIME 解析 ──
# imap 用 native-tls，Windows 下走系统 schannel，无需安装 OpenSSL
imap = { version = "2.4", default-features = false, features = ["tls"] }
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "native-tls"] }
# full_encoding 必须开启：否则 QQ/163 常见的 GBK 编码中文邮件会乱码
mail-parser = { version = "0.11", features = ["full_encoding"] }
base64 = "0.22"
chrono = "0.4"

# ── 邮箱授权码的本地加密存储（AES-256-GCM）──
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

# ── AI 分析：调用 OpenAI 兼容的 chat/completions 接口 ──
# 复用 native-tls，避免再引入一套 TLS 实现
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }

# ── 本地存储：单文件 SQLite（bundled 静态编译，零系统依赖）──
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# ── 桌面通知：来新邮件时弹系统通知（Windows 通知中心 / macOS / Linux）──
# 精确锁 2.4.0：该版本要求 tauri ^2.10，与本仓库锁定的 tauri 2.11.x /
# @tauri-apps/api 2.11.x 同 minor；2.5.0 会强制 tauri ^2.12，触发 Tauri CLI
# 的 crate 与 npm 包版本一致性校验失败（tauri build 直接报错）。
tauri-plugin-notification = "=2.4.0"

# Android 上 native-tls 落到 OpenSSL：用 vendored 随包编译静态链入，免系统依赖
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
