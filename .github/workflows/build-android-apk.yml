name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [codex/android-0.2.1]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android 16 SDK and NDK
        env:
          NDK_VERSION: 27.3.13750724
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Build unsigned universal APK
        run: pnpm android:build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-android-0.2.1-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*-unsigned.apk
          if-no-files-found: error
